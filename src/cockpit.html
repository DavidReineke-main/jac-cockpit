<title>JAC Admin Cockpit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: quiet app shell, header with text tabs, one column of content per view.
   Direction: calm, exact, dry like an ops log. Graphite surfaces, muted RAF blue accent.
   Moment: the op-night strip. Signature: deadlines as DTG in mono.
   Redesigned with unslop by Damir Sokolovsky (@heydamir), CC BY 4.0 */
:root{
  --bg:#fafafa; --card:#ffffff; --raised:#f4f4f5; --line:rgba(23,23,23,.08); --line-strong:rgba(23,23,23,.14);
  --fg:#171717; --fg2:#525252; --fg3:#737373;
  --accent:#2f5d9a; --accent-ink:#2a5590; --on-accent:#ffffff;
  --pos:#16a34a; --neg:#dc2626; --caution:#b45309;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141415; --card:#19191b; --raised:#232325; --line:rgba(237,237,237,.08); --line-strong:rgba(237,237,237,.14);
  --fg:#ededed; --fg2:#a1a1a6; --fg3:#85858b;
  --accent:#8db2e8; --accent-ink:#8db2e8; --on-accent:#141415;
  --pos:#4cc38a; --neg:#e5484d; --caution:#e0a84a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141415; --card:#19191b; --raised:#232325; --line:rgba(237,237,237,.08); --line-strong:rgba(237,237,237,.14);
  --fg:#ededed; --fg2:#a1a1a6; --fg3:#85858b;
  --accent:#8db2e8; --accent-ink:#8db2e8; --on-accent:#141415;
  --pos:#4cc38a; --neg:#e5484d; --caution:#e0a84a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:20px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1120px;margin:0 auto}
@media (min-width:720px){.wrap{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:24px;height:56px}
.logo{font-size:16px;font-weight:500;white-space:nowrap}
.logo span{color:var(--fg3);font-weight:400}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-right:auto;scrollbar-width:none}
nav.tabs a{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:8px;color:var(--fg2);text-decoration:none;white-space:nowrap;transition:background-color .15s var(--ease),color .15s var(--ease)}
nav.tabs a:hover{background:var(--raised);color:var(--fg)}
nav.tabs a[aria-current="page"]{background:var(--raised);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
nav.tabs .n{font-family:var(--f-mono);font-size:12px;color:var(--neg)}
.who{font-size:13px;color:var(--fg3);white-space:nowrap}
@media (max-width:720px){.bar{height:auto;flex-wrap:wrap;gap:8px 16px;padding-block:12px}.who{margin-left:auto}nav.tabs{order:3;width:100%;margin-right:0}}

a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* page */
main{padding-block:40px 80px;display:grid;grid-template-columns:minmax(0,1fr);gap:40px}
h1,h2{margin:0;font-weight:500;text-wrap:balance}
h1{font-size:28px;line-height:34px}
h2{font-size:15px;line-height:20px}
.sub{color:var(--fg2);margin:8px 0 0;max-width:62ch}
.meta{color:var(--fg3);font-size:13px}
.mono{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}

/* buttons */
button{font:inherit;cursor:pointer}
.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--card);color:var(--fg);white-space:nowrap;transition:background-color .15s var(--ease),border-color .15s var(--ease),transform .12s var(--ease)}
.btn:hover{background:var(--raised)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.primary:hover{opacity:.9}
.link{background:none;border:0;padding:0;color:var(--accent-ink);font-size:13px;white-space:nowrap}
.link:hover{text-decoration:underline}
.link[disabled]{color:var(--fg3);cursor:default;text-decoration:none}

/* op-night strip: the one moment */
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.night{padding:16px;display:grid;gap:12px;align-content:start}
.night.next{box-shadow:inset 0 0 0 1px var(--accent)}
.night .d{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.night .d b{font-weight:500}
.units{display:grid;gap:8px}
.u{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.u i{width:8px;height:8px;border-radius:2px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line-strong)}
.u.ok i{background:var(--pos);box-shadow:none}
.u.open i{background:var(--caution);box-shadow:none}
.u.late i{background:var(--neg);box-shadow:none}
.u span:last-child{color:var(--fg3)}
.prog{height:4px;border-radius:2px;background:var(--raised);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.legend span{display:flex;gap:8px;align-items:center}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
@media (max-width:900px){.strip{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}

/* list rows */
.list{display:grid}
.row{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row input[type=checkbox]{width:16px;height:16px;margin:0;accent-color:var(--fg)}
.row .t{display:block}
.row.done .t{color:var(--fg3);text-decoration:line-through}
.row .right{display:flex;gap:16px;align-items:center;justify-content:flex-end}
.due{color:var(--fg3)}
.due.over{color:var(--neg)}
.more{padding:12px 16px;border-top:1px solid var(--line)}
@media (max-width:560px){.row{grid-template-columns:20px minmax(0,1fr)}.row .right{grid-column:2;justify-content:flex-start}}

/* status text with dot */
.st{display:inline-flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fg3)}
.st.ok::before{background:var(--pos)} .st.open::before{background:var(--caution)} .st.late::before{background:var(--neg)}

/* LOA rows */
.loa{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr) minmax(0,1.2fr) auto;gap:16px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.loa:first-child{border-top:0}
.loa q{color:var(--fg2);quotes:"“" "”"}
.loa.headrow{color:var(--fg3);font-size:13px;padding-block:8px}
@media (max-width:760px){.loa{grid-template-columns:minmax(0,1fr)}.loa.headrow{display:none}}

/* night prep */
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--raised);border-radius:10px}
.seg button{height:28px;padding:0 12px;border:0;border-radius:6px;background:none;color:var(--fg2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.06),inset 0 0 0 1px var(--line)}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.col .ch{padding:16px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.col .ch div{display:flex;justify-content:space-between;gap:8px}
.check{display:grid;grid-template-columns:16px minmax(0,1fr);gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check input{width:16px;height:16px;margin:2px 0 0;accent-color:var(--fg)}
.check label{cursor:pointer}
.check small{display:block;color:var(--fg3);font-size:13px}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}

/* summaries */
.sum{padding:20px;display:grid;gap:16px}
.sum .top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:baseline}
.figs{display:flex;gap:32px;flex-wrap:wrap}
.figs div{display:grid;gap:4px}
.figs dt{color:var(--fg3);font-size:13px}
.figs dd{margin:0;font-size:20px;line-height:24px;font-variant-numeric:tabular-nums}
.sum .acts{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
details summary{cursor:pointer;color:var(--fg3);font-size:13px;width:max-content}
details pre{margin:8px 0 0;padding:12px 16px;background:var(--raised);border-radius:8px;font-family:var(--f-mono);font-size:12px;line-height:18px;white-space:pre-wrap;color:var(--fg2)}

/* roles */
select,input[type=text]{font:inherit;height:32px;padding:0 8px;border:1px solid var(--line-strong);border-radius:8px;background:var(--card);color:var(--fg)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:680px}
th,td{text-align:left;padding:12px 16px;border-top:1px solid var(--line);vertical-align:middle}
thead th{border-top:0;color:var(--fg3);font-weight:400;font-size:13px}
.matrix th:not(:first-child),.matrix td:not(:first-child){text-align:center}
.matrix input{width:16px;height:16px;accent-color:var(--fg)}
.foot{padding:12px 16px;border-top:1px solid var(--line);color:var(--fg3);font-size:13px}

/* deployment cycle */
.cyc{display:flex;gap:4px}
.cyc>div{flex:var(--w) 1 0;min-width:0;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;gap:4px;align-content:start}
.cyc>div b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cyc>div .mono,.cyc>div .wk{color:var(--fg3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cyc>div.now{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cyc>div.now .wk{color:var(--accent-ink)}
.cyc>div.past{background:transparent}
.ticks{display:flex;gap:2px;margin-top:4px}
.ticks em{flex:1;height:4px;border-radius:2px;background:var(--raised)}
.ticks em.on{background:var(--accent)}
@media (max-width:640px){.cyc{flex-direction:column}}

/* ORBAT */
.orbat-top{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.orbat{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;align-items:start}
@media (max-width:960px){.orbat{grid-template-columns:minmax(0,1fr)}}
.units-col{display:grid;gap:16px}
.sqn .sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px 16px 12px;flex-wrap:wrap}
.flight-label{display:flex;justify-content:space-between;gap:8px;padding:8px 16px;border-top:1px solid var(--line);color:var(--fg3);font-size:13px;background:var(--raised)}
.person{display:grid;grid-template-columns:64px minmax(0,1fr) 96px 120px;gap:12px;align-items:center;width:100%;padding:8px 16px;min-height:44px;border:0;border-top:1px solid var(--line);background:none;color:var(--fg);text-align:left;font:inherit;cursor:pointer;transition:background-color .15s var(--ease)}
.flight-label + .person{border-top:0}
.person:hover{background:var(--raised)}
.person .rk{font-family:var(--f-mono);font-size:12px;color:var(--fg2)}
.person .nm{min-width:0}
.person .nm span{display:block;color:var(--fg3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .gap{font-size:13px;color:var(--fg3);text-align:right;white-space:nowrap}
.person .gap.warn{color:var(--caution)}
.person .gap.ready{color:var(--pos)}
.meter{height:4px;border-radius:2px;background:var(--raised);overflow:hidden}
.person:hover .meter{background:var(--card)}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.none,.person:hover .meter.none{background:transparent}
@media (max-width:600px){.person{grid-template-columns:56px minmax(0,1fr) 104px}.person .meter{display:none}}
details.res summary{padding:12px 16px;border-top:1px solid var(--line);list-style:none}
details.res summary::-webkit-details-marker{display:none}
.side{display:grid;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px)}
.side .card{padding:16px;display:grid;gap:12px}
.demand{display:grid;gap:8px}
.demand div{display:grid;grid-template-columns:minmax(0,1fr) 24px;gap:4px 8px;align-items:center;font-size:13px}
.demand .meter{grid-column:1 / -1}
.demand b{font-weight:400;font-family:var(--f-mono);font-size:12px;text-align:right;color:var(--fg2)}
.side ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.side li button{background:none;border:0;padding:4px 0;font:inherit;color:var(--fg);cursor:pointer;text-align:left}
.side li button:hover{color:var(--accent-ink)}
/* person sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:30}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--card);border-left:1px solid var(--line);z-index:31;overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 24px;display:grid;gap:24px;align-content:start;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.sheet .x{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
.sheet h2{font-size:20px;line-height:26px}
.kv2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;font-size:13px;margin:0}
.kv2 dt{color:var(--fg3)} .kv2 dd{margin:0}
.reqs{display:grid}
.req{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.req .ic{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line-strong)}
.req.ok .ic{background:var(--pos);box-shadow:none}
.req.ok span:nth-child(2){color:var(--fg2)}
.note-line{font-size:13px;color:var(--fg3)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;z-index:20}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ---------- Sample data (fictional names, prototype only) ---------- */
const NOW = new Date('2026-11-19T15:30:00Z');

const UNITS = {
  '18A':{name:'No. 18 Sqn, Alpha Flight',short:'18 Alpha'},
  '18B':{name:'No. 18 Sqn, Bravo Flight',short:'18 Bravo'},
  '18C':{name:'No. 18 Sqn, Charlie Flight',short:'18 Charlie'},
  '662':{name:'No. 662 Sqn AAC',short:'662'},
  'ALIC':{name:'Air Land Integration Cell',short:'ALIC'}
};

/* ---------- Deployment cycle ----------
   Maintained by JAC HQ in Setup. Blocks run back to back from the anchor Monday; each is an operation,
   admin or PDT with a number of weeks. Every week label in the cockpit is derived from this list. */
const CYCLE={anchor:'2026-08-31',blocks:[
  {id:'b1',kind:'op',name:'Op PALADIN',weeks:10},
  {id:'b2',kind:'admin',name:'Admin',weeks:1},
  {id:'b3',kind:'pdt',name:'PDT',weeks:4},
  {id:'b4',kind:'admin',name:'Admin',weeks:2},
  {id:'b5',kind:'op',name:'Next operation',weeks:10}
]};
const DAY=864e5,mon=s=>new Date(s+'T00:00:00Z');
function cycleBlocks(){let t=mon(CYCLE.anchor).getTime();return CYCLE.blocks.map(b=>{const s=t;t+=b.weeks*7*DAY;return{...b,start:new Date(s),end:new Date(t-DAY)}})}
function weekOf(d){const x=typeof d==='string'?mon(d):d;for(const b of cycleBlocks()){if(x>=b.start&&x<=new Date(b.end.getTime()+DAY-1))return{b,n:Math.floor((x-b.start)/(7*DAY))+1}}return null}
function weekLabel(d){const w=weekOf(d);if(!w)return'Outside the cycle';
  return w.b.kind==='admin'?`Admin week${w.b.weeks>1?` ${w.n} of ${w.b.weeks}`:''}`:w.b.kind==='pdt'?`PDT Week ${w.n}`:`${w.b.name} W${w.n}`}
const shortDate=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'});

const NIGHTS = [
  {id:'n0',date:'2026-11-04',label:'Wed 4 Nov',flight:'18C',
   items:{'18C':{att:'done',pr:'signed'},'662':{att:'done',pr:'signed'},'ALIC':{att:'done',pr:'signed'}},form3:'done'},
  {id:'n1',date:'2026-11-07',label:'Sat 7 Nov',flight:'18A',
   items:{'18A':{att:'done',pr:'signed'},'662':{att:'done',pr:'signed'},'ALIC':{att:'done',pr:'signed'}},form3:'done'},
  {id:'n2',date:'2026-11-08',label:'Sun 8 Nov',flight:'18B',
   items:{'18B':{att:'done',pr:'posted'},'662':{att:'done',pr:'signed'},'ALIC':{att:'done',pr:'signed'}},form3:'done'},
  {id:'n3',date:'2026-11-18',label:'Wed 18 Nov',flight:'18C',
   items:{'18C':{att:'missing',pr:'posted'},'662':{att:'missing',pr:'missing'},'ALIC':{att:'done',pr:'posted'}},form3:'open'}
];
const UPCOMING = [{label:'Sat 21 Nov',date:'2026-11-21',flight:'18A',prep:'Sat 21 Nov'},{label:'Sun 22 Nov',date:'2026-11-22',flight:'18B',prep:'Sun 22 Nov'}];
[...NIGHTS,...UPCOMING].forEach(n=>Object.defineProperty(n,'op',{get:()=>weekLabel(n.date)}));
const deadline = n => new Date(new Date(n.date+'T19:00:00Z').getTime()+48*3600e3);

/* LOA check, forum only: LOA threads in the flight forums vs the state entered in the attendance tracker.
   loa: time the LOA thread was posted (null = none). att: state in the tracker (null = not entered yet). */
const LOAS = [
  {id:'l1',who:'FSAcr K. Pike',unit:'18A',night:'Sat 21 Nov',nightStart:'2026-11-21T19:00:00Z',loa:'19 Nov 10:12',att:null},
  {id:'l2',who:'Plt Off R. Marsh',unit:'18B',night:'Sun 22 Nov',nightStart:'2026-11-22T19:00:00Z',loa:'18 Nov 21:06',att:null},
  {id:'l3',who:'Off Cdt L. Brandt',unit:'18C',night:'Wed 18 Nov',nightStart:'2026-11-18T19:00:00Z',loa:'18 Nov 17:31',att:'Excused'},
  {id:'l4',who:'A/SAcr J. Rowe',unit:'18B',night:'Sun 8 Nov',nightStart:'2026-11-08T19:00:00Z',loa:null,att:'Excused'},
  {id:'l5',who:'AirTpr D. Kerr',unit:'662',night:'Sun 8 Nov',nightStart:'2026-11-08T19:00:00Z',loa:'6 Nov 20:44',att:'Absent'},
  {id:'l6',who:'SAcr M. Quinn',unit:'18A',night:'Sat 7 Nov',nightStart:'2026-11-07T19:00:00Z',loa:'5 Nov 18:30',att:'Excused'}
];

const PREP = {
  'Sat 21 Nov':{date:'2026-11-21',cols:[
    {unit:'18A',items:[['Logistics orders checked','Requested Logistics, ETA this night',true],['Slotting posted','Flight IC',true],['Crew confirmed','Flight 2IC',false],['J3 taskings received','2 of 3 Coy requests in',false],['Briefing posted','Flight IC',false],['LOAs checked','1 without forum LOA',false]]},
    {unit:'662',items:[['Slotting posted','662 IC',true],['J3 taskings received','CAS window from Coy',true],['Briefing posted','662 IC',false],['LOAs checked','1 without forum LOA',false]]},

function loaTime(s){const[d,m,hm]=s.split(' ');const[h,mi]=hm.split(':');return new Date(Date.UTC(2026,MONTHS[m],+d,+h,+mi))}
function loaOnTime(l){return l.loa&&loaTime(l.loa)<=new Date(new Date(l.nightStart).getTime()-3*3600e3)}
function loaState(l){
  if(state.resolved.has(l.id))return['ok','Corrected'];
  const onTime=loaOnTime(l);
  if(!l.att)return[onTime?'ok':'open',onTime?'LOA on time, night ahead':'LOA under 3h before'];

function holders(sq,post,fl){

  const by={

function vacancies(){

function progress(p){

  const target=p.rank==='A/SAcr'?'SAcr':null; // acting rank: must attain SAcr courses (SOP 9-7)
  const curMiss=target?[]:miss(p.rank);
  const nextReq=next?L.req[next]:[];const nextMiss=next?miss(next):[];
  const step=next?L.step[next]:null,post=next?L.post[next]||null:null,ready=!!next&&nextMiss.length===0;
  let opening=null;
  if(step==='position'){const sq=baseSq(p),flPost=FLIGHT_POSTS.includes(post);
    opening=p.sq===sq&&!holders(sq,post,flPost?p.fl:null).length?{post,fl:flPost?p.fl:null}:null}

function renderSheet(){
  const root=$('#sheet-root');const p=ORBAT.people.find(x=>x.id===state.open);
  if(!p){root.innerHTML='';return}
  const g=progress(p),can=VIEWERS[state.viewer].can(p),L=g.k?LADDERS[g.k]:null;
  const reqRow=c=>{const ok=p.done.has(c),nom=state.nominated.has(p.id+c);
    return `<div class="req ${ok?'ok':''}"><span class="ic" aria-hidden="true"></span><span>${esc(c)}${!ok&&nom?' <span class="meta">nominated</span>':''}</span>
      <span>${!ok&&can?`${nom?'':`<button class="link" data-nominate="${esc(c)}">Nominate</button> `}<button class="link" data-pass="${esc(c)}" style="margin-left:12px">Mark passed</button>`:''}</span></div>`};
  let body='';
  if(!g.k)body=`<p class="note-line">No rank ladder in SOP 9-7 for ${esc(p.sq)}</p>`;
  else if(g.unknown)body=`<p class="note-line">${esc(p.rank)} is not part of the ${esc(L.label)} ladder in SOP 9-7. The sheet may still show a rank from before the restructure</p>`;
  else{
    if(g.acting)body+=`<div><h2 style="font-size:15px">Acting rank, needs SAcr courses</h2><p class="note-line" style="margin:4px 0 8px">SOP 9-7: attain SAcr course requirements within 3 months</p><div class="reqs">${L.req.SAcr.map(reqRow).join('')}</div></div>`;
    else if(g.curMiss.length)body+=`<div><h2 style="font-size:15px">Missing for current rank ${esc(p.rank)}</h2><div class="reqs" style="margin-top:8px">${g.curMiss.map(reqRow).join('')}</div></div>`;
    if(g.next&&!g.acting&&g.step==='direct')body+=`<div><h2 style="font-size:15px">Towards ${esc(g.next)}</h2><p class="note-line" style="margin:4px 0 8px">${g.nextReq.length-g.nextMiss.length} of ${g.nextReq.length} courses. The chain of command can promote once all are done</p><div class="reqs">${g.nextReq.map(reqRow).join('')}</div></div>`;
    if(g.next&&!g.acting&&g.step==='position'){const where=`${esc(g.post)}${FLIGHT_POSTS.includes(g.post)?` of ${esc(flName(p.fl))}`:''}`;
      const held=holders(baseSq(p),g.post,FLIGHT_POSTS.includes(g.post)?p.fl:null);
      body+=`<div><h2 style="font-size:15px">Next step is a post: ${esc(g.next)}, ${esc(g.post)}</h2>
        <p class="note-line" style="margin:4px 0 8px">${g.opening?`The ${where} is open. ${g.ready?'Has the courses to apply when it is advertised':`Needs ${g.nextMiss.length} more course${g.nextMiss.length>1?'s':''} to apply`}`:p.sq!==baseSq(p)?'Reserves do not hold posts':`Held by ${held.map(h=>esc(h.rank+' '+h.name)).join(', ')}. Only possible when this post becomes vacant`}. Posts are advertised for 48h and filled by promotion board (SOP 9-5)</p>
        <div class="reqs">${g.nextReq.map(c=>{const ok=p.done.has(c);return `<div class="req ${ok?'ok':''}"><span class="ic" aria-hidden="true"></span><span>${esc(c)}</span><span></span></div>`}).join('')}</div></div>`}
    if(g.next&&!g.acting&&g.step==='nco')body+=`<p class="note-line">Next rank ${esc(g.next)} is an NCO rank. Promotion follows a recommendation by the chain of command and is not offered here</p>`;
  }
  const boardBtn=can&&g.promotable?(state.boards.has(p.id)?`<button class="btn" disabled>Promotion to ${esc(g.next)} requested</button>`:`<button class="btn primary" data-board="${p.id}">Promote to ${esc(g.next)}</button>`):'';
  root.innerHTML=`<div class="scrim" data-close></div>
  <aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <button class="btn x" data-close aria-label="Close">Close</button>
    <div><span class="mono" style="color:var(--fg3)">${esc(p.rank||'No rank')}</span><h2 id="sheet-title">${esc(p.name)}</h2></div>
    <dl class="kv2"><dt>Unit</dt><dd>${esc(p.sq)}</dd><dt>Flight</dt><dd>${esc(p.fl||'–')}</dd><dt>Position</dt><dd>${esc(p.pos||'–')}</dd>${p.wings?`<dt>Wings</dt><dd class="mono">${esc(p.wings)}</dd>`:''}</dl>
    ${body}
    <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${boardBtn}${p.uid?`<a class="link" href="https://4thib.co.uk/user-${esc(p.uid)}.html" target="_blank" rel="noopener">Forum profile</a>`:''}</div>
    <p class="note-line">${can?'You can manage this member. Changes write back to the Input tab in the hosted version':'Read only. Managing this member needs their squadron or flight command'}</p>
  </aside>`;
  root.querySelector('.x').focus();
}

/* ---------- Views ---------- */
const VIEWS={orbat:['ORBAT',renderOrbat],overview:['Admin',renderOverview],loa:['LOA check',renderLoa],prep:['Night prep',renderPrep],roles:['Setup',renderRoles]};
function renderTabs(cur){
  const over=buildTasks().filter(t=>!state.done.has(t.id)&&isOver(t)).length;
  const loa=LOAS.filter(l=>loaState(l)[0]==='late').length;
  const n={overview:over,loa};
  $('#tabs').innerHTML=Object.entries(VIEWS).map(([k,[label]])=>`<a href="#${k}" ${k===cur?'aria-current="page"':''}>${label}${n[k]?`<span class="n" aria-label="${n[k]} need attention">${n[k]}</span>`:''}</a>`).join('');
}

function unitMark(n,u){
  const it=n.items[u],over=deadline(n)<NOW,us=uaStatus(u,n.date),uaOk=!['missing','partial'].includes(us);
  if(it.att==='done'&&it.pr==='signed'&&uaOk)return['ok','Done'];
  const missing=[it.att!=='done'?'tracker':null,uaOk?null:'unit sheet',it.pr==='missing'?'report':it.pr==='posted'?'sign-off':null].filter(Boolean).join(', ');
  return[over?'late':'open',missing];
}
function renderOverview(){
  const all=buildTasks(),open=all.filter(t=>!state.done.has(t.id));
  const over=open.filter(isOver).length;
  const week=open.filter(t=>t.due&&!isOver(t)).length;
  const shown=state.showAll?all:all.slice(0,6);
  const strips=NIGHTS.slice(-3).map(n=>`
    <div class="card night"><div class="d"><b>${n.label}</b><span class="meta">${esc(n.op.replace('Op PALADIN','PALADIN'))}</span></div>
      <div class="units">${[n.flight,'662','ALIC'].map(u=>{const[c,txt]=unitMark(n,u);return `<div class="u ${c}"><i aria-hidden="true"></i><span>${UNITS[u].short}</span><span>${esc(txt)}</span></div>`}).join('')}</div>
    </div>`).join('')+UPCOMING.map((u,i)=>{const cols=PREP[u.prep].cols,tot=cols.reduce((a,c)=>a+c.items.length,0),dn=cols.reduce((a,c)=>a+c.items.filter(x=>x[2]).length,0);

      <div class="d"><b>${u.label}</b><span class="meta">${i===0?'Next':'Upcoming'}</span></div>
      <div class="units"><div class="u"><i aria-hidden="true"></i><span>Prep</span><span class="mono">${dn} of ${tot}</span></div></div>
      <div class="prog" aria-hidden="true"><i style="width:${Math.round(dn/tot*100)}%"></i></div></a>`}).join('');
  return `
  <section><h1>Thursday 19 November</h1>
    <p class="sub">${esc(weekLabel(NOW))}. ${over} overdue and ${week} due before the weekend across No. 18, 662 and ALIC</p></section>

  <section><div class="head"><h2>Op nights</h2><span class="meta">48h deadline after each night</span></div>
    <div class="strip">${strips}</div>
    <div class="legend meta"><span><i style="background:var(--pos)"></i>Done</span><span><i style="background:var(--caution)"></i>Open</span><span><i style="background:var(--neg)"></i>Past deadline</span></div></section>
  <section><div class="head"><h2>Needs you</h2><span class="meta">${open.length} open</span></div>
    <div class="card list">${shown.map(taskRow).join('')}
      ${all.length>6?`<div class="more"><button class="link" data-more>${state.showAll?'Show fewer':`Show ${all.length-6} more`}</button></div>`:''}</div></section>
  ${renderRoster()}`;
}
function renderRoster(){

    add:[x.name,`Add to ${U(x.to)}`,x.rank],move:[x.name,`Move ${U(x.from)} → ${U(x.to)}`,x.rank],

    <div class="card list">${d.length?d.map((x,i)=>{const[a,b,c]=line(x),id='r-'+i;return `<div class="row ${state.done.has('roster-'+i)?'done':''}"><input type="checkbox" id="${id}" data-done="roster-${i}" ${state.done.has('roster-'+i)?'checked':''} aria-label="Mark changed">

function cycleStrip(){

  <div class="cyc">${win.map(b=>{const now=w&&b.id===w.b.id,past=b.end<NOW;
    return `<div class="${now?'now':past?'past':''}" style="--w:${Math.max(b.weeks,1.6)}"><b>${esc(b.kind==='op'?b.name:kindName[b.kind])}</b>
      <span class="mono">${past?'ended':'from'} ${shortDate(past?b.end:b.start)}</span>
      <span class="wk">${now?`Week ${w.n} of ${b.weeks}`:`${b.weeks} week${b.weeks>1?'s':''}`}</span>
      <i class="ticks">${Array.from({length:b.weeks},(_,k)=>`<em class="${now&&k<w.n?'on':''}"></em>`).join('')}</i></div>`}).join('')}</div>`;
}

function taskRow(t){

function renderLogi(dateStr){

      <tbody>${RANKS.map((r,ri)=>`<tr><td>${esc(r)}</td>${PERMS.map((p,pi)=>`<td><input type="checkbox" id="perm-${u}-${ri}-${pi}" aria-label="${esc(r)}, ${esc(p)}" data-perm="${ri}-${pi}" ${m[ri][pi]?'checked':''}></td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <div class="foot">Changes in this prototype last until reload</div></div></section>
  <section><div class="head"><h2>Recurring tasks</h2><span class="meta">From the squadron’s Roles and Responsibilities doc</span></div>
    <div class="card"><div class="tbl"><table><thead><tr><th>Task</th><th>Owner</th><th>Deadline</th><th></th></tr></thead>
      <tbody>${t.map((row,i)=>`<tr><td>${esc(row[0])}</td><td><select id="own-${u}-${i}" data-owner="${i}" aria-label="Owner of ${esc(row[0])}">${RANKS.map(r=>`<option ${r===row[1]?'selected':''}>${esc(r)}</option>`).join('')}</select></td><td class="meta">${esc(row[2])}</td><td style="text-align:right"><button class="link" data-deltask="${i}">Remove</button></td></tr>`).join('')}
      <tr><td><input type="text" id="newtask" placeholder="New task" style="width:100%"></td><td><select id="newowner" aria-label="Owner of new task">${RANKS.map(r=>`<option>${esc(r)}</option>`).join('')}</select></td><td><input type="text" id="newdl" placeholder="48h after op" style="width:136px" aria-label="Deadline"></td><td style="text-align:right"><button class="btn" id="addtask">Add</button></td></tr>
      </tbody></table></div></div></section>`;
}

/* ---------- Router and events ---------- */
function route(){let k=location.hash.slice(1);if(!VIEWS[k])k='orbat';renderTabs(k);$('#view').innerHTML=VIEWS[k][1]();renderSheet()}
window.addEventListener('hashchange',()=>{state.open=null;route();window.scrollTo(0,0)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.open){const id=state.open;state.open=null;renderSheet();document.querySelector(`[data-person="${id}"]`)?.focus()}});
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-goprep]');if(g){state.prepNight=g.dataset.goprep;return}
  const b=e.target.closest('button,.scrim');if(!b)return;const d=b.dataset;
  if(d.person){state.open=d.person;renderSheet();return}
  if('close'in d){const id=state.open;state.open=null;renderSheet();document.querySelector(`[data-person="${id}"]`)?.focus();return}
  if(d.filter){state.filter=d.filter;route();return}
  if(d.scroll){document.getElementById(d.scroll)?.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(d.cycIns!==undefined){CYCLE.blocks.splice(+d.cycIns+1,0,{id:'b'+Date.now(),kind:'admin',name:'Admin',weeks:1});route();return}
  if(d.cycDel!==undefined){if(CYCLE.blocks.length>1)CYCLE.blocks.splice(+d.cycDel,1);route();return}
  if(d.nominate){state.nominated.add(state.open+d.nominate);toast(`Nominated for ${d.nominate}`);renderSheet();return}
  if(d.pass){ORBAT.people.find(x=>x.id===state.open).done.add(d.pass);toast(`${d.pass} marked passed. Prototype, sheet unchanged`);route();return}
  if(d.board){state.boards.add(d.board);toast('Promotion drafted for the Admin Centre. Prototype, nothing posted');renderSheet();return}
  if('more'in d){state.showAll=!state.showAll;route()}
  else if(d.nudge){state.nudged.add(d.nudge);toast('Forum PM drafted. Prototype, nothing sent');route()}
  else if(d.resolve){state.resolved.add(d.resolve);route()}
  else if('open'in d){toast('Would open the forum thread or Drive file')}
  else if(d.night){state.prepNight=d.night;route()}
  else if(d.deltask){state.templates[state.roleUnit].splice(+d.deltask,1);route()}
  else if(b.id==='addtask'){const n=$('#newtask').value.trim();if(!n){toast('Enter a task name first');return}state.templates[state.roleUnit].push([n,$('#newowner').value,$('#newdl').value.trim()||'No deadline']);route()}
});
document.addEventListener('change',e=>{const el=e.target,d=el.dataset;
  if(d.done){el.checked?state.done.add(d.done):state.done.delete(d.done);route()}
  else if(d.prep){const[c,i]=d.prep.split('-').map(Number);PREP[state.prepNight].cols[c].items[i][2]=el.checked;route()}
  else if(d.perm){const[r,p]=d.perm.split('-').map(Number);state.roles[state.roleUnit][r][p]=el.checked?1:0}
  else if(d.owner){state.templates[state.roleUnit][+d.owner][1]=el.value}
  else if(el.id==='roleunit'){state.roleUnit=el.value;route()}
  else if(el.id==='viewer'){state.viewer=el.value;route()}
  else if(d.cycKind!==undefined){const b=CYCLE.blocks[+d.cycKind];b.kind=el.value;if(el.value!=='op')b.name=el.value==='pdt'?'PDT':'Admin';route()}
  else if(d.cycName!==undefined){CYCLE.blocks[+d.cycName].name=el.value.trim()||'Unnamed';route()}
  else if(d.cycWeeks!==undefined){CYCLE.blocks[+d.cycWeeks].weeks=Math.min(20,Math.max(1,parseInt(el.value)||1));route()}
  else if(el.id==='anchor'&&el.value){const x=mon(el.value);x.setUTCDate(x.getUTCDate()-((x.getUTCDay()+6)%7));CYCLE.anchor=x.toISOString().slice(0,10);route()}
});
route();
</script>
